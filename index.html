<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Techno Fact | تكنو فاكت</title>
<meta name="description" content="Techno Fact — مقالات تقنية وبرمجة بالعربي والإنجليزي | Tech & programming articles in Arabic and English">
<!--OG-->
<meta property="og:title" content="Techno Fact | تكنو فاكت">
<meta property="og:description" content="مقالات تقنية وبرمجة بالعربي والإنجليزي">
<meta property="og:type" content="website">
<!--/OG-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/og/icon-192.png">
<meta name="theme-color" content="#070b14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='700' text-anchor='middle' fill='%2322d3ee'%3ETF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --a:#22d3ee; --a2:#a3e635;
  --bg:#070b14; --bg2:#0a1020; --card:#0d1424; --line:#1a2540; --line2:#24324f;
  --ink:#e6edf7; --mut:#8a9ab5; --code:#060a12;
  --r:18px; --maxw:1180px;
  --ff:'IBM Plex Sans Arabic','Space Grotesk',system-ui,sans-serif;
  --ffd:'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif;
  --ffm:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme=light]{
  --bg:#f6f8fc; --bg2:#eef2f9; --card:#ffffff; --line:#e1e7f0; --line2:#cfd8e6;
  --ink:#0b1220; --mut:#5b6b85; --code:#0b1220;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:16.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--a);color:#000}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.mono{font-family:var(--ffm)}

/* background grid */
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;opacity:.35;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%)}
.glow{position:fixed;z-index:-1;width:620px;height:620px;border-radius:50%;filter:blur(120px);opacity:.16;pointer-events:none}
.glow.g1{background:var(--a);top:-260px;inset-inline-start:-160px}
.glow.g2{background:var(--a2);top:-200px;inset-inline-end:-260px;opacity:.08}

/* progress */
#progress{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--a2));z-index:100;transition:width .1s}

/* header */
header.top{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--ffd);font-weight:700;font-size:19px;letter-spacing:-.3px}
.logo .mk{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--ffm);font-size:13px;font-weight:600;
  color:#000;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 0 24px color-mix(in srgb,var(--a) 45%,transparent)}
.logo small{display:block;font-family:var(--ffm);font-size:10.5px;color:var(--mut);font-weight:400;letter-spacing:.5px;line-height:1}
.links{display:flex;gap:4px}
.links a{padding:8px 14px;border-radius:10px;color:var(--mut);font-weight:500;font-size:15px;transition:.2s}
.links a:hover{color:var(--ink);background:var(--card)}
.links a.on{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.tools{display:flex;gap:8px;align-items:center}
.ib{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:grid;place-items:center;font-size:13px;font-family:var(--ffm);font-weight:600;transition:.2s}
.ib:hover{border-color:var(--a);color:var(--a)}
.burger{display:none}
@media(max-width:820px){
  .links{position:fixed;top:calc(66px + env(safe-area-inset-top));inset-inline:0;flex-direction:column;padding:12px 16px 18px;gap:2px;
    background:var(--bg);border-bottom:1px solid var(--line);transform:translateY(-12px);opacity:0;pointer-events:none;transition:.25s}
  .links.open{transform:none;opacity:1;pointer-events:auto}
  .links a{padding:12px 14px;font-size:16px}
  .burger{display:grid}
}

/* hero */
.hero{padding:72px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding-top:44px;gap:32px}}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--ffm);font-size:12.5px;color:var(--a);
  padding:6px 12px;border:1px solid color-mix(in srgb,var(--a) 35%,transparent);border-radius:999px;background:color-mix(in srgb,var(--a) 8%,transparent)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--a2);box-shadow:0 0 10px var(--a2);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.hero h1{font-family:var(--ffd);font-size:clamp(40px,7vw,74px);line-height:1.05;margin:18px 0 16px;letter-spacing:-1.5px;font-weight:700}
.hero h1 .gr{background:linear-gradient(100deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(17px,2.2vw,20px);color:var(--mut);max-width:560px;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line2);
  background:var(--card);color:var(--ink);transition:.2s}
.btn:hover{border-color:var(--a);transform:translateY(-1px)}
.btn.pri{background:var(--a);color:#001016;border-color:var(--a);box-shadow:0 8px 30px color-mix(in srgb,var(--a) 35%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}

.term{background:var(--code);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.02) inset;direction:ltr;text-align:left}
.term .bar{display:flex;align-items:center;gap:7px;padding:12px 14px;border-bottom:1px solid #16213a;background:#0a1020}
.term .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.term .bar i:nth-child(2){background:#febc2e}.term .bar i:nth-child(3){background:#28c840}
.term .bar span{margin-inline-start:auto;font-family:var(--ffm);font-size:11.5px;color:#5b6b85}
.term pre{margin:0;padding:18px 18px 22px;font-family:var(--ffm);font-size:13.5px;line-height:1.85;color:#cfe3ff;min-height:240px;white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--a2)}.term .c{color:#5b6b85}.term .k{color:var(--a)}
.cur{display:inline-block;width:8px;height:16px;background:var(--a);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:36px 0 10px}
.stat{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 18px}
.stat b{font-family:var(--ffd);font-size:30px;display:block;line-height:1.1}
.stat span{color:var(--mut);font-size:14px}

/* sections */
section.blk{padding:44px 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.sh h2{font-family:var(--ffd);font-size:clamp(24px,3.4vw,32px);margin:0;letter-spacing:-.5px}
.sh h2 small{display:block;font-family:var(--ffm);font-size:12.5px;color:var(--a);font-weight:400;letter-spacing:.5px;margin-bottom:4px}
.sh a.more{color:var(--mut);font-weight:500;font-size:15px;white-space:nowrap}
.sh a.more:hover{color:var(--a)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{border:1px solid var(--line);background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .25s,border-color .25s,box-shadow .25s;position:relative}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--a) 50%,var(--line));box-shadow:0 20px 50px rgba(0,0,0,.25)}
.cover{aspect-ratio:16/9;background:var(--bg2);position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover svg{width:100%;height:100%;display:block}
.cbody{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--ffm);font-size:11.5px;padding:3px 9px;border-radius:7px;color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--a) 22%,transparent);direction:ltr}
.card h3{font-size:19px;line-height:1.45;margin:2px 0 0;font-weight:700}
.card p{color:var(--mut);margin:0;font-size:15px;line-height:1.7}
.meta{display:flex;gap:14px;color:var(--mut);font-size:13px;font-family:var(--ffm);margin-top:auto;padding-top:8px}

.feat{display:grid;grid-template-columns:1.15fr 1fr;border:1px solid var(--line);background:var(--card);border-radius:22px;overflow:hidden;transition:.25s}
.feat:hover{border-color:color-mix(in srgb,var(--a) 50%,var(--line))}
.feat .cover{aspect-ratio:auto;min-height:300px}
.feat .cbody{padding:30px;justify-content:center;gap:12px}
.feat h3{font-size:clamp(22px,3vw,30px);line-height:1.35}
.feat .lbl{font-family:var(--ffm);font-size:12px;color:var(--a2)}
@media(max-width:820px){.feat{grid-template-columns:1fr}.feat .cover{min-height:200px}.feat .cbody{padding:22px}}

.topics{display:flex;flex-wrap:wrap;gap:10px}
.topics a{font-family:var(--ffm);font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);direction:ltr;transition:.2s}
.topics a:hover{border-color:var(--a);color:var(--a)}
.topics a sup{color:var(--mut);margin-inline-start:4px}

/* blog page */
.ph{padding:52px 0 18px}
.ph h1{font-family:var(--ffd);font-size:clamp(32px,5vw,48px);margin:0 0 6px;letter-spacing:-1px}
.ph p{color:var(--mut);margin:0}
.filters{display:flex;flex-direction:column;gap:14px;margin:22px 0 26px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;height:50px}
.search:focus-within{border-color:var(--a)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 14px;font-family:var(--ffm);font-size:13px;white-space:nowrap}
.chip.on{background:var(--a);color:#001016;border-color:var(--a);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:60px 10px;border:1px dashed var(--line2);border-radius:var(--r)}

/* post */
.post-wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:48px;padding:30px 0 40px}
@media(max-width:1000px){.post-wrap{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.back{display:inline-flex;gap:6px;color:var(--mut);font-size:14.5px;margin-bottom:16px}
.back:hover{color:var(--a)}
.post{min-width:0}
.post h1{font-family:var(--ff);font-size:clamp(28px,4.6vw,44px);line-height:1.3;margin:12px 0 14px;letter-spacing:-.5px}
.post .meta{margin:0 0 24px;padding:0;flex-wrap:wrap}
.post .cover{border-radius:var(--r);border:1px solid var(--line);margin-bottom:30px}
.notice{border:1px solid color-mix(in srgb,var(--a2) 40%,transparent);background:color-mix(in srgb,var(--a2) 8%,transparent);
  padding:10px 14px;border-radius:12px;font-size:14.5px;margin-bottom:22px}
.prose{font-size:18px;line-height:1.95}
.prose h2{font-size:27px;margin:44px 0 12px;line-height:1.4;scroll-margin-top:90px}
.prose h3{font-size:21px;margin:32px 0 10px;scroll-margin-top:90px}
.prose h2::before{content:'#';color:var(--a);font-family:var(--ffm);margin-inline-end:10px;opacity:.7}
.prose p{margin:0 0 18px}
.prose a{color:var(--a);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.prose ul,.prose ol{padding-inline-start:24px;margin:0 0 18px}
.prose li{margin:6px 0}
.prose li::marker{color:var(--a)}
.prose blockquote{margin:24px 0;padding:14px 20px;border-inline-start:3px solid var(--a);background:var(--card);border-radius:12px;color:var(--ink)}
.prose blockquote p:last-child{margin:0}
.prose img{border-radius:14px;border:1px solid var(--line);margin:24px auto}
.prose :not(pre)>code{font-family:var(--ffm);font-size:.86em;background:var(--card);border:1px solid var(--line);padding:2px 7px;border-radius:7px;direction:ltr;unicode-bidi:embed}
.prose table{width:100%;border-collapse:collapse;margin:22px 0;font-size:16px;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:10px 14px;text-align:start}
.prose th{background:var(--card)}
.prose hr{border:none;border-top:1px solid var(--line);margin:36px 0}
.codebox{position:relative;margin:24px 0;border:1px solid #16213a;border-radius:14px;overflow:hidden;background:#060a12;direction:ltr;text-align:left}
.codebox .cbh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0a1020;border-bottom:1px solid #16213a;font-family:var(--ffm);font-size:12px;color:#6c7d99}
.codebox button{background:none;border:1px solid #24324f;color:#9fb0cc;border-radius:7px;padding:3px 10px;font-family:var(--ffm);font-size:11.5px}
.codebox button:hover{color:var(--a);border-color:var(--a)}
.codebox pre{margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--ffm);font-size:14px;line-height:1.75;color:#d6e4ff}
/* hljs theme */
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:#c792ea}.hljs-string,.hljs-attr{color:#c3e88d}.hljs-number,.hljs-literal{color:#f78c6c}
.hljs-comment{color:#5b6b85;font-style:italic}.hljs-title,.hljs-title.function_{color:#82aaff}.hljs-tag,.hljs-name{color:#f07178}
.hljs-attribute,.hljs-variable,.hljs-params{color:#ffcb6b}.hljs-meta{color:#89ddff}.hljs-symbol,.hljs-property{color:#89ddff}

.toc{position:sticky;top:96px;align-self:start;font-size:14px}
.toc h4{font-family:var(--ffm);font-size:12px;color:var(--mut);letter-spacing:1px;margin:0 0 12px;text-transform:uppercase}
.toc a{display:block;padding:6px 12px;color:var(--mut);border-inline-start:2px solid var(--line);line-height:1.5}
.toc a.l3{padding-inline-start:24px;font-size:13px}
.toc a:hover,.toc a.on{color:var(--a);border-color:var(--a)}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:40px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.share span{color:var(--mut);font-size:14px;margin-inline-end:6px}
.share a,.share button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:14px}
.share a:hover,.share button:hover{border-color:var(--a);color:var(--a)}

/* about */
.about{display:grid;grid-template-columns:1fr 320px;gap:36px;padding:20px 0 50px}
@media(max-width:900px){.about{grid-template-columns:1fr}}
.side-card{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:22px}
.side-card h4{margin:0 0 12px;font-size:16px}
.soc{display:flex;flex-direction:column;gap:8px}
.soc a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px;direction:ltr;justify-content:flex-end}
[dir=ltr] .soc a{justify-content:flex-start}
.soc a:hover{border-color:var(--a);color:var(--a)}

/* project card */
.plinks{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.plinks a{font-size:13.5px;padding:7px 12px;border:1px solid var(--line);border-radius:10px}
.plinks a:hover{border-color:var(--a);color:var(--a)}

footer{border-top:1px solid var(--line);margin-top:40px;padding:36px 0 calc(36px + env(safe-area-inset-bottom));color:var(--mut);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer .fs{display:flex;gap:8px}
footer .fs a{border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-family:var(--ffm);font-size:12px}
footer .fs a:hover{color:var(--a);border-color:var(--a)}

/* engagement */
.engage{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:34px 0 0}
.likeb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:700;transition:.2s}
.likeb:hover{border-color:#f472b6;color:#f472b6}
.likeb.on{background:rgba(244,114,182,.12);border-color:#f472b6;color:#f472b6}
.likeb.on .hrt{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.4)}}
.share a.fb:hover{border-color:#1877f2;color:#1877f2}
.author{display:flex;gap:16px;align-items:center;margin:34px 0 0;padding:20px;border:1px solid var(--line);background:var(--card);border-radius:var(--r)}
.author .av{width:64px;height:64px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--a),var(--a2)) center/cover;display:grid;place-items:center;font-family:var(--ffm);font-weight:600;color:#000;font-size:18px;border:2px solid var(--line2)}
.author b{display:block;font-size:17px}.author small{color:var(--a);font-family:var(--ffm);font-size:12px}.author p{margin:4px 0 0;color:var(--mut);font-size:15px;line-height:1.7}
.news{position:relative;overflow:hidden;margin:34px 0 0;padding:28px;border-radius:22px;border:1px solid color-mix(in srgb,var(--a) 35%,var(--line));
  background:radial-gradient(ellipse at 0% 0%,color-mix(in srgb,var(--a) 14%,transparent),transparent 60%),var(--card)}
.news h3{margin:0 0 4px;font-size:22px}.news p{margin:0 0 16px;color:var(--mut)}
.news form{display:flex;gap:10px;flex-wrap:wrap}
.news input{flex:1;min-width:200px;height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);padding:0 16px;font:inherit;outline:none;direction:ltr}
.news input:focus{border-color:var(--a)}
.news button{height:50px}
.comments{margin:40px 0 0;padding-top:28px;border-top:1px solid var(--line)}
.comments h3{margin:0 0 16px;font-size:22px}
.vw{display:inline-flex;gap:5px;align-items:center}
#totop{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));inset-inline-end:20px;width:46px;height:46px;border-radius:14px;border:1px solid var(--line2);
  background:var(--card);color:var(--a);font-size:20px;z-index:60;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#totop.show{opacity:1;pointer-events:auto;transform:none}
.rank{position:absolute;top:12px;inset-inline-start:12px;z-index:2;font-family:var(--ffm);font-weight:600;font-size:13px;background:rgba(0,0,0,.6);color:#fff;
  padding:4px 10px;border-radius:9px;backdrop-filter:blur(6px)}
.fvis{font-family:var(--ffm);font-size:12px;color:var(--mut)}
.loading{display:grid;place-items:center;min-height:60vh;font-family:var(--ffm);color:var(--mut)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="progress"></div>
<div class="bg-grid"></div><div class="glow g1"></div><div class="glow g2"></div>

<header class="top">
  <div class="wrap nav">
    <a href="#home" class="logo"><span class="mk">&lt;TF/&gt;</span><span><span id="siteName">Techno Fact</span><small id="siteSub">TECH · CODE · FACTS</small></span></a>
    <nav class="links" id="links">
      <a href="#home" data-r="home" data-t="nav_home"></a>
      <a href="#blog" data-r="blog" data-t="nav_blog"></a>
      <a href="#projects" data-r="projects" data-t="nav_projects"></a>
      <a href="#about" data-r="about" data-t="nav_about"></a>
    </nav>
    <div class="tools">
      <button class="ib" id="langBtn" aria-label="Language">EN</button>
      <button class="ib" id="themeBtn" aria-label="Theme">☾</button>
      <button class="ib burger" id="burger" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main id="app"><div class="loading">loading_ <span class="cur"></span></div></main>

<footer><div class="wrap">
  <div>© <span id="yr"></span> <b id="footName">Techno Fact</b> — <span data-t="rights"></span> <span class="fvis" id="fvis"></span></div>
  <div class="fs" id="footSoc"></div>
</div></footer>
<div class="toast" id="toast"></div>
<button id="totop" aria-label="Top">↑</button>

<script>
const T={
  ar:{nav_home:'الرئيسية',nav_blog:'المقالات',nav_projects:'المشاريع',nav_about:'عنّي',
    read:'اقرأ المقال',all_posts:'كل المقالات',latest:'أحدث المقالات',featured:'مقال مميز',projects:'المشاريع',topics:'المواضيع',
    articles:'مقال',projects_n:'مشروع',topics_n:'موضوع',explore:'تصفّح المقالات',my_projects:'مشاريعي',min:'د قراءة',
    search:'ابحث في المقالات…',all:'الكل',no_results:'لا توجد نتائج مطابقة',back:'رجوع للمقالات',toc:'في هذا المقال',
    share:'شارك:',copy:'نسخ الرابط',copied:'تم النسخ ✓',related:'مقالات ذات صلة',visit:'زيارة الموقع',code:'الكود',
    blog_sub:'مقالات في التقنية والبرمجة وتطوير الويب.',proj_sub:'مواقع وتطبيقات قمت ببنائها.',about_t:'عن تكنو فاكت',contact:'تواصل معي',
    rights:'جميع الحقوق محفوظة',not_found:'الصفحة غير موجودة',other_lang:'هذا المقال غير متوفر بالعربية بعد — يتم عرض النسخة الإنجليزية.',
    setup:'الموقع جاهز! ادخل إلى لوحة التحكم لتهيئة المحتوى.',copy_code:'نسخ',no_posts:'لا توجد مقالات بعد.',views:'مشاهدة',like:'أعجبني',popular:'الأكثر قراءة',written_by:'بقلم',news_t:'اشترك في النشرة البريدية',news_p:'وصلك كل مقال جديد على بريدك مباشرة — بدون إزعاج.',news_btn:'اشترك',email_ph:'you@example.com',comments:'التعليقات',visits:'زيارة للموقع'},
  en:{nav_home:'Home',nav_blog:'Articles',nav_projects:'Projects',nav_about:'About',
    read:'Read article',all_posts:'All articles',latest:'Latest articles',featured:'Featured',projects:'Projects',topics:'Topics',
    articles:'articles',projects_n:'projects',topics_n:'topics',explore:'Browse articles',my_projects:'My projects',min:'min read',
    search:'Search articles…',all:'All',no_results:'No matching results',back:'Back to articles',toc:'On this page',
    share:'Share:',copy:'Copy link',copied:'Copied ✓',related:'Related articles',visit:'Visit site',code:'Code',
    blog_sub:'Articles on technology, programming and web development.',proj_sub:'Websites and apps I have built.',about_t:'About Techno Fact',contact:'Get in touch',
    rights:'All rights reserved',not_found:'Page not found',other_lang:'This article is not available in English yet — showing the Arabic version.',
    setup:'Your site is live! Open the dashboard to set up content.',copy_code:'Copy',no_posts:'No articles yet.',views:'views',like:'Like',popular:'Most read',written_by:'Written by',news_t:'Subscribe to the newsletter',news_p:'Get every new article straight to your inbox — no spam.',news_btn:'Subscribe',email_ph:'you@example.com',comments:'Comments',visits:'site visits'}
};
const S={lang:'ar',theme:'dark',settings:{},posts:[],projects:[],tag:'',q:'',md:{}};
/* ---- counters (Abacus, free, no signup) ---- */
const CNT='https://abacus.jasoncameron.dev';
const san=(v,n=48)=>{v=String(v).toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-');if(v.length<=n)return v;let h=0;for(const c of v)h=(h*31+c.charCodeAt(0))|0;return v.slice(0,n-8)+'-'+Math.abs(h).toString(36).slice(0,7)};
const NS=()=>san(S.settings.counter_ns||('tf-'+location.hostname.split('.')[0]+'-'+(location.pathname.split('/').filter(Boolean)[0]||'site').replace(/\.html$/,'')));
const featOn=k=>(S.settings.features||{})[k]!==false;
async function counter(key,hit){ try{ const r=await fetch(`${CNT}/${hit?'hit':'get'}/${NS()}/${san(key)}`); if(!r.ok) return 0; const j=await r.json(); return +j.value||0; }catch(e){ return null; } }
const fmtN=n=>n==null?'—':(n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':String(n));
const baseUrl=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const shareUrl=slug=>baseUrl()+'p/'+slug+'/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=k=>T[S.lang][k]||k;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

S.lang=store.get('tf-lang')||((navigator.language||'ar').startsWith('ar')?'ar':'en');
S.theme=store.get('tf-theme')||'dark';

const SOC_LONG={facebook:'Facebook',instagram:'Instagram',x:'X / Twitter',youtube:'YouTube',tiktok:'TikTok',linkedin:'LinkedIn',github:'GitHub',telegram:'Telegram',whatsapp:'WhatsApp'};
const SOC_SHORT={facebook:'Facebook',instagram:'Instagram',x:'X',youtube:'YouTube',tiktok:'TikTok',linkedin:'LinkedIn',github:'GitHub',telegram:'Telegram',whatsapp:'WhatsApp'};
const socUrl=(k,v)=>{v=String(v||'').trim(); if(k==='whatsapp'&&/^\+?[\d\s-]+$/.test(v)) return 'https://wa.me/'+v.replace(/\D/g,''); return v;};
function tr(o,f){ if(!o) return ''; const a=o[S.lang]||{}, b=o[S.lang==='ar'?'en':'ar']||{}; return a[f]||b[f]||''; }
function fmtDate(d){ try{return new Date(d+'T00:00:00').toLocaleDateString(S.lang==='ar'?'ar-u-nu-latn':'en-US',{year:'numeric',month:'long',day:'numeric'})}catch(e){return d} }
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function img(p){ return p? (/^(https?:|data:)/.test(p)?p:p) : '' }
function genCover(seed,label){
  const h=hash(seed), hue=[188,160,265,210,140,320][h%6], x=h%7;
  const glyphs=['{ }','</>','=>','( )','[ ]','#!','$_'][x];
  return `<svg viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice"><defs>
  <linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},80%,14%)"/><stop offset="1" stop-color="hsl(${(hue+50)%360},70%,7%)"/></linearGradient>
  <pattern id="p${h}" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="hsla(${hue},90%,60%,.12)"/></pattern></defs>
  <rect width="400" height="225" fill="url(#g${h})"/><rect width="400" height="225" fill="url(#p${h})"/>
  <circle cx="${300-(h%120)}" cy="${40+(h%90)}" r="90" fill="hsla(${hue},90%,55%,.18)"/>
  <text x="200" y="128" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="54" font-weight="600" fill="hsla(${hue},95%,70%,.9)">${glyphs}</text>
  <text x="20" y="208" font-family="JetBrains Mono,monospace" font-size="11" fill="hsla(${hue},60%,75%,.55)">${esc(label||'technofact')}</text></svg>`;
}
function coverHTML(p,kind){ return p.cover? `<img src="${esc(img(p.cover))}" alt="" loading="lazy">` : genCover(p.slug||p.id, (kind||'post')+'/'+(p.slug||p.id)); }
function readMin(md){ const w=(md||'').replace(/```[\s\S]*?```/g,' ').split(/\s+/).filter(Boolean).length; return Math.max(1,Math.round(w/200)); }
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}

async function getJSON(p){ try{ const r=await fetch(p+'?t='+Date.now()); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
async function getMD(slug,lang){
  const k=slug+'.'+lang; if(k in S.md) return S.md[k];
  try{ const r=await fetch('content/'+k+'.md?t='+Date.now()); S.md[k]= r.ok? await r.text(): null; }catch(e){ S.md[k]=null; }
  return S.md[k];
}
const published=()=>S.posts.filter(p=>p.status!=='draft' && (!p.date || p.date<=new Date().toISOString().slice(0,10))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

function applyChrome(){
  const html=document.documentElement;
  html.lang=S.lang; html.dir=S.lang==='ar'?'rtl':'ltr'; html.dataset.theme=S.theme;
  $('#langBtn').textContent=S.lang==='ar'?'EN':'ع';
  $('#themeBtn').textContent=S.theme==='dark'?'☀':'☾';
  const nm=S.settings['name_'+S.lang]||S.settings.name_en||'Techno Fact';
  $('#siteName').textContent=nm; $('#footName').textContent=nm;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  if(S.settings.accent) html.style.setProperty('--a',S.settings.accent);
  const so=S.settings.social||{}; const names=SOC_SHORT;
  $('#footSoc').innerHTML=Object.keys(names).filter(k=>so[k]).map(k=>`<a href="${esc(socUrl(k,so[k]))}" target="_blank" rel="noopener">${names[k]}</a>`).join('');
}

function postCard(p){
  const title=tr(p,'title'), ex=tr(p,'excerpt');
  return `<a class="card fade" href="#post-${esc(p.slug)}"><div class="cover">${coverHTML(p)}</div><div class="cbody">
    <div class="tags">${(p.tags||[]).slice(0,3).map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div>
    <h3>${esc(title)}</h3><p>${esc(ex)}</p>
    <div class="meta"><span>${fmtDate(p.date)}</span>${p.readMin?`<span>${p.readMin} ${t('min')}</span>`:''}</div></div></a>`;
}
function projCard(p){
  return `<div class="card fade"><div class="cover">${coverHTML({...p,slug:p.id},'project')}</div><div class="cbody">
    <div class="tags">${(p.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
    <h3>${esc(tr(p,'title'))}</h3><p>${esc(tr(p,'desc'))}</p>
    <div class="plinks">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">↗ ${t('visit')}</a>`:''}${p.repo?`<a href="${esc(p.repo)}" target="_blank" rel="noopener">&lt;/&gt; ${t('code')}</a>`:''}</div></div></div>`;
}
function tagCounts(){ const m={}; published().forEach(p=>(p.tags||[]).forEach(x=>m[x]=(m[x]||0)+1)); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }

let typer=null;
function home(){
  const ps=published(), feat=ps.find(p=>p.featured)||ps[0], rest=ps.filter(p=>p!==feat).slice(0,6);
  const tags=tagCounts(), projs=[...S.projects].sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)).slice(0,3);
  const nm=S.settings['name_'+S.lang]||'Techno Fact';
  const parts=nm.split(' ');
  return `<div class="wrap">
  <section class="hero">
    <div class="fade">
      <span class="badge"><i></i> ${S.lang==='ar'?'// تقنية · برمجة · حقائق':'// tech · code · facts'}</span>
      <h1>${esc(parts[0])} <span class="gr">${esc(parts.slice(1).join(' '))}</span></h1>
      <p class="lead">${esc(S.settings['tagline_'+S.lang]||'')}</p>
      <div class="cta"><a class="btn pri" href="#blog">${t('explore')} ${S.lang==='ar'?'←':'→'}</a><a class="btn" href="#projects">${t('my_projects')}</a></div>
      <div class="stats">
        <div class="stat"><b>${ps.length}</b><span>${t('articles')}</span></div>
        <div class="stat"><b>${S.projects.length}</b><span>${t('projects_n')}</span></div>
        <div class="stat"><b>${tags.length}</b><span>${t('topics_n')}</span></div>
      </div>
    </div>
    <div class="term fade"><div class="bar"><i></i><i></i><i></i><span>~/technofact — zsh</span></div><pre id="term"></pre></div>
  </section>
  ${!ps.length?`<div class="empty">${t(S.posts.length?'no_posts':'setup')}</div>`:''}
  ${feat?`<section class="blk"><div class="sh"><h2><small>// featured</small>${t('featured')}</h2></div>
    <a class="feat fade" href="#post-${esc(feat.slug)}"><div class="cover">${coverHTML(feat)}</div><div class="cbody">
    <span class="lbl">★ ${fmtDate(feat.date)}</span><h3>${esc(tr(feat,'title'))}</h3><p>${esc(tr(feat,'excerpt'))}</p>
    <div class="tags">${(feat.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div>
    <span class="btn pri" style="align-self:flex-start;margin-top:8px">${t('read')} ${S.lang==='ar'?'←':'→'}</span></div></a></section>`:''}
  ${rest.length?`<section class="blk"><div class="sh"><h2><small>// latest</small>${t('latest')}</h2><a class="more" href="#blog">${t('all_posts')} ${S.lang==='ar'?'←':'→'}</a></div>
    <div class="grid">${rest.map(postCard).join('')}</div></section>`:''}
  ${projs.length?`<section class="blk"><div class="sh"><h2><small>// projects</small>${t('projects')}</h2><a class="more" href="#projects">${t('my_projects')} ${S.lang==='ar'?'←':'→'}</a></div>
    <div class="grid">${projs.map(projCard).join('')}</div></section>`:''}
  <section class="blk hide-empty" id="popSec" style="display:none"><div class="sh"><h2><small>// trending</small>${t('popular')}</h2></div><div class="grid" id="popGrid"></div></section>
  ${tags.length?`<section class="blk"><div class="sh"><h2><small>// topics</small>${t('topics')}</h2></div>
    <div class="topics">${tags.map(([k,n])=>`<a href="#tag-${encodeURIComponent(k)}">#${esc(k)}<sup>${n}</sup></a>`).join('')}</div></section>`:''}
  ${newsBox()}
  </div>`;
}
function runTerm(){
  const el=$('#term'); if(!el) return; clearTimeout(typer);
  const ps=published().slice(0,3);
  const lines=[['p','$ '],['k','technofact --latest\n'],['c','# '+(S.lang==='ar'?'جلب أحدث المقالات...':'fetching latest articles...')+'\n'],
    ...ps.flatMap((p,i)=>[['p','→ '],['', (tr(p,'title'))+'\n']]),
    ['p','\n$ '],['k','echo $MISSION\n'],['', (S.lang==='ar'?'تقنية واضحة. كود حقيقي.':'Clear tech. Real code.')+'\n'],['p','\n$ ']];
  let li=0,ci=0,html='';
  const step=()=>{
    if(!document.body.contains(el)) return;
    if(li>=lines.length){ el.innerHTML=html+'<span class="cur"></span>'; return; }
    const [cls,txt]=lines[li]; const ch=txt[ci++];
    html+= cls?`<span class="${cls}">${esc(ch)}</span>`:esc(ch);
    if(ci>=txt.length){li++;ci=0}
    el.innerHTML=html+'<span class="cur"></span>';
    typer=setTimeout(step, cls==='k'?38:12);
  }; step();
}

function newsBox(){
  const u=(S.settings.newsletter||'').trim(); if(!u) return '';
  const action=/^https?:/.test(u)?u:`https://buttondown.com/api/emails/embed-subscribe/${encodeURIComponent(u)}`;
  return `<div class="news fade"><h3>✉ ${t('news_t')}</h3><p>${t('news_p')}</p>
  <form action="${esc(action)}" method="post" target="_blank"><input type="email" name="email" required placeholder="${t('email_ph')}"><input type="hidden" name="embed" value="1">
  <button class="btn pri" type="submit">${t('news_btn')}</button></form></div>`;
}
function authorBox(){
  const s=S.settings, name=s.author_name||s['name_'+S.lang]||''; if(!name) return '';
  const bio=s['author_bio_'+S.lang]||s.author_bio_ar||s.author_bio_en||'';
  const av=s.author_avatar?`style="background-image:url('${esc(s.author_avatar)}')"`:'';
  return `<div class="author"><div class="av" ${av}>${s.author_avatar?'':esc(name.trim().slice(0,1))}</div><div><small>${t('written_by')}</small><b>${esc(name)}</b>${bio?`<p>${esc(bio)}</p>`:''}</div></div>`;
}
async function loadPopular(){
  if(!featOn('views')) return; const ps=published().slice(0,30); if(ps.length<2) return;
  const vals=await Promise.all(ps.map(p=>counter('p-'+p.slug,false)));
  const top=ps.map((p,i)=>({p,v:vals[i]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  const sec=$('#popSec'); if(!sec||!top.length) return;
  $('#popGrid').innerHTML=top.map((x,i)=>postCard(x.p).replace('<div class="cover">',`<div class="cover"><span class="rank">#${i+1} · ${fmtN(x.v)} ${t('views')}</span>`)).join('');
  sec.style.display='';
}
function loadComments(slug){
  const c=S.settings.comments||{}; const box=$('#comments');
  if(!box||!featOn('comments')||!c.repoId||!c.categoryId){ box&&box.remove(); return; }
  const sc=document.createElement('script'); sc.src='https://giscus.app/client.js'; sc.async=true; sc.crossOrigin='anonymous';
  const at={'data-repo':c.repo,'data-repo-id':c.repoId,'data-category':c.category||'Announcements','data-category-id':c.categoryId,'data-mapping':'specific','data-term':'post-'+slug,
    'data-strict':'1','data-reactions-enabled':'1','data-emit-metadata':'0','data-input-position':'top','data-theme':S.theme==='dark'?'dark_dimmed':'light','data-lang':S.lang,'data-loading':'lazy'};
  Object.entries(at).forEach(([k,v])=>sc.setAttribute(k,v)); box.appendChild(sc);
}
function blog(){
  const tags=tagCounts();
  return `<div class="wrap"><div class="ph fade"><h1>${t('nav_blog')}</h1><p>${t('blog_sub')}</p></div>
  <div class="filters"><label class="search"><span class="mono" style="color:var(--a)">⌕</span><input id="q" placeholder="${t('search')}" value="${esc(S.q)}"></label>
  <div class="chips"><button class="chip ${!S.tag?'on':''}" data-tag="">${t('all')}</button>${tags.map(([k])=>`<button class="chip ${S.tag===k?'on':''}" data-tag="${esc(k)}">#${esc(k)}</button>`).join('')}</div></div>
  <div class="grid" id="bgrid"></div></div>`;
}
function renderBlogGrid(){
  const q=S.q.trim().toLowerCase();
  const ps=published().filter(p=>(!S.tag||(p.tags||[]).includes(S.tag)) &&
    (!q||[p.ar?.title,p.en?.title,p.ar?.excerpt,p.en?.excerpt,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)));
  $('#bgrid').innerHTML= ps.length? ps.map(postCard).join('') : `<div class="empty" style="grid-column:1/-1">${t('no_results')}</div>`;
}

async function post(slug){
  const p=S.posts.find(x=>x.slug===slug && x.status!=='draft');
  if(!p) return notFound();
  const app=$('#app'); app.innerHTML='<div class="loading">loading_ <span class="cur"></span></div>';
  let md=await getMD(slug,S.lang), fallback=false;
  if(md==null){ md=await getMD(slug,S.lang==='ar'?'en':'ar'); fallback=md!=null; }
  if(location.hash!=='#post-'+slug) return;
  const shownLang=fallback?(S.lang==='ar'?'en':'ar'):S.lang;
  const html=DOMPurify.sanitize(marked.parse(md||''));
  const url=shareUrl(slug), title=tr(p,'title');
  document.title=title+' | '+(S.settings['name_'+S.lang]||'Techno Fact');
  const rel=published().filter(x=>x!==p && (x.tags||[]).some(g=>(p.tags||[]).includes(g))).slice(0,3);
  app.innerHTML=`<div class="wrap"><div class="post-wrap"><article class="post fade" dir="${shownLang==='ar'?'rtl':'ltr'}" lang="${shownLang}">
    <a class="back" href="#blog">${S.lang==='ar'?'→':'←'} ${t('back')}</a>
    <div class="tags">${(p.tags||[]).map(x=>`<a class="tag" href="#tag-${encodeURIComponent(x)}">#${esc(x)}</a>`).join('')}</div>
    <h1>${esc(title)}</h1>
    <div class="meta"><span>${fmtDate(p.date)}</span><span>${readMin(md)} ${t('min')}</span>${featOn('views')?`<span class="vw">👁 <b id="pviews">…</b> ${t('views')}</span>`:''}</div>
    ${p.cover?`<div class="cover"><img src="${esc(img(p.cover))}" alt=""></div>`:''}
    ${fallback?`<div class="notice">${t('other_lang')}</div>`:''}
    <div class="prose" id="prose">${html}</div>
    ${featOn('likes')?`<div class="engage"><button class="likeb" id="likeb"><span class="hrt">♥</span> ${t('like')} <b id="likec">…</b></button></div>`:''}
    <div class="share"><span>${t('share')}</span>
      <button id="cpy">🔗 ${t('copy')}</button>
      <a class="fb" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Facebook</a>
      <a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(title+' '+url)}">WhatsApp</a>
      <a target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}">Telegram</a>
      <a target="_blank" rel="noopener" href="https://x.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}">X</a>
      <a target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}">LinkedIn</a>
    </div>
    ${authorBox()}
    ${newsBox()}
    <div class="comments" id="comments"><h3>💬 ${t('comments')}</h3></div>
  </article><aside class="toc" id="toc"></aside></div>
  ${rel.length?`<section class="blk"><div class="sh"><h2><small>// related</small>${t('related')}</h2></div><div class="grid">${rel.map(postCard).join('')}</div></section>`:''}</div>`;
  enhanceProse(); window.scrollTo(0,0);
  $('#cpy').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast(t('copied'))}catch(e){toast(url)}};
  loadComments(slug);
  if(featOn('views')){ let k='tf-v-'+slug, seen=false; try{seen=sessionStorage.getItem(k)}catch(e){}
    counter('p-'+slug,!seen).then(v=>{ const e=$('#pviews'); if(e) e.textContent=fmtN(v); try{sessionStorage.setItem(k,'1')}catch(e){} }); }
  if(featOn('likes')){ const lk='tf-like-'+slug; const liked=store.get(lk); const b=$('#likeb'); if(liked) b.classList.add('on');
    counter('like-'+slug,false).then(v=>{const e=$('#likec'); if(e) e.textContent=fmtN(v)});
    b.onclick=async()=>{ if(store.get(lk)) return toast('♥'); store.set(lk,'1'); b.classList.add('on'); const e=$('#likec'); e.textContent=fmtN((parseInt(e.textContent)||0)+1); const v=await counter('like-'+slug,true); if(v!=null) e.textContent=fmtN(v); }; }
}
function enhanceProse(){
  const pr=$('#prose'); if(!pr) return;
  pr.querySelectorAll('pre>code').forEach(code=>{
    const pre=code.parentElement, lang=(code.className.match(/language-(\w+)/)||[])[1]||'code';
    try{ if(window.hljs) hljs.highlightElement(code) }catch(e){}
    const box=document.createElement('div'); box.className='codebox';
    box.innerHTML=`<div class="cbh"><span>${esc(lang)}</span><button>${t('copy_code')}</button></div>`;
    pre.replaceWith(box); box.appendChild(pre);
    box.querySelector('button').onclick=async e=>{try{await navigator.clipboard.writeText(code.innerText);e.target.textContent='✓'}catch(_){e.target.textContent='✗'}setTimeout(()=>e.target.textContent=t('copy_code'),1500)};
  });
  pr.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  const hs=[...pr.querySelectorAll('h2,h3')];
  hs.forEach((h,i)=>h.id='h-'+i);
  const toc=$('#toc');
  if(hs.length>1) toc.innerHTML=`<h4>${t('toc')}</h4>`+hs.map(h=>`<a class="${h.tagName==='H3'?'l3':''}" data-id="${h.id}">${esc(h.textContent)}</a>`).join('');
  toc.querySelectorAll('a').forEach(a=>a.onclick=()=>document.getElementById(a.dataset.id).scrollIntoView({behavior:'smooth'}));
}

function projects(){
  const ps=[...S.projects].sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
  return `<div class="wrap"><div class="ph fade"><h1>${t('nav_projects')}</h1><p>${t('proj_sub')}</p></div>
  <div class="grid" style="margin:26px 0 30px">${ps.map(projCard).join('')||`<div class="empty" style="grid-column:1/-1">—</div>`}</div></div>`;
}
function about(){
  const s=S.settings, so=s.social||{};
  const names=SOC_LONG;
  return `<div class="wrap"><div class="ph fade"><h1>${t('about_t')}</h1></div>
  <div class="about"><div class="prose fade">${DOMPurify.sanitize(marked.parse(s['about_'+S.lang]||s.about_en||''))}</div>
  <aside class="side-card fade"><h4>${t('contact')}</h4>
    ${s.email?`<p style="margin:0 0 12px;direction:ltr;text-align:start" class="mono"><a href="mailto:${esc(s.email)}" style="color:var(--a)">${esc(s.email)}</a></p>`:''}
    <div class="soc">${Object.keys(names).filter(k=>so[k]).map(k=>`<a href="${esc(socUrl(k,so[k]))}" target="_blank" rel="noopener">${names[k]} ↗</a>`).join('')||'<span style="color:var(--mut)">—</span>'}</div>
  </aside></div></div>`;
}
function notFound(){ $('#app').innerHTML=`<div class="wrap"><div class="ph"><h1 class="mono">404</h1><p>${t('not_found')}</p><p style="margin-top:20px"><a class="btn pri" href="#home">${t('nav_home')}</a></p></div></div>`; }

function route(){
  const h=decodeURIComponent(location.hash.slice(1))||'home';
  let r=h; $('#links').classList.remove('open');
  document.title=S.settings['name_'+S.lang]? S.settings['name_'+S.lang]+' | '+(S.lang==='ar'?'مقالات تقنية وبرمجة':'Tech & programming'):'Techno Fact';
  const app=$('#app');
  if(h.startsWith('post-')){ r='blog'; post(h.slice(5)); }
  else if(h.startsWith('tag-')){ r='blog'; S.tag=h.slice(4); S.q=''; app.innerHTML=blog(); bindBlog(); }
  else if(h==='blog'){ app.innerHTML=blog(); bindBlog(); }
  else if(h==='projects') app.innerHTML=projects();
  else if(h==='about') app.innerHTML=about();
  else if(h==='home'){ app.innerHTML=home(); runTerm(); loadPopular(); }
  else notFound();
  document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  if(!h.startsWith('post-')) window.scrollTo(0,0);
}
function bindBlog(){
  renderBlogGrid();
  $('#q').oninput=e=>{S.q=e.target.value;renderBlogGrid()};
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.tag=c.dataset.tag;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));renderBlogGrid()});
}

window.addEventListener('scroll',()=>{
  const pr=$('#prose'), bar=$('#progress');
  if(!pr){bar.style.width=0;return}
  const r=pr.getBoundingClientRect(), total=pr.offsetHeight-innerHeight*.6;
  bar.style.width=Math.min(100,Math.max(0,(-r.top+90)/total*100))+'%';
  const hs=[...pr.querySelectorAll('h2,h3')]; let cur=null; hs.forEach(h=>{if(h.getBoundingClientRect().top<140)cur=h.id});
  document.querySelectorAll('.toc a').forEach(a=>a.classList.toggle('on',a.dataset.id===cur));
},{passive:true});
$('#langBtn').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';store.set('tf-lang',S.lang);applyChrome();route()};
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';store.set('tf-theme',S.theme);applyChrome()};
$('#burger').onclick=()=>$('#links').classList.toggle('open');
window.addEventListener('hashchange',route);
$('#yr').textContent=new Date().getFullYear();

(async()=>{
  if(window.marked) marked.setOptions({gfm:true,breaks:false});
  const [s,p,pr]=await Promise.all([getJSON('data/settings.json'),getJSON('data/posts.json'),getJSON('data/projects.json')]);
  S.settings=s||{name_ar:'تكنو فاكت',name_en:'Techno Fact'}; S.posts=p||[]; S.projects=pr||[];
  applyChrome(); route();
  if(featOn('views')){ let seen=false; try{seen=sessionStorage.getItem('tf-site')}catch(e){}
    counter('site',!seen).then(v=>{ if(v){ $('#fvis').textContent='· 👁 '+fmtN(v)+' '+t('visits'); } try{sessionStorage.setItem('tf-site','1')}catch(e){} }); }
})();
window.addEventListener('scroll',()=>$('#totop').classList.toggle('show',scrollY>700),{passive:true});
$('#totop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
</body>
</html>
